name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: curio
          POSTGRES_PASSWORD: curio
          POSTGRES_DB: curio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U curio -d curio_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://curio:curio@localhost:5432/curio_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic -c src/curio/db/alembic.ini upgrade head
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: uv run alembic -c src/curio/db/alembic.ini check
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv sync --locked
      - run: npm --prefix frontend ci
      - name: Check generated OpenAPI TypeScript types are up to date
        run: |
          npm --prefix frontend run gen:api
          git diff --exit-code frontend/src/api/schema.d.ts
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build

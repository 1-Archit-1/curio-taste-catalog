name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: curio
          POSTGRES_PASSWORD: curio
          POSTGRES_DB: curio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U curio -d curio_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://curio:curio@localhost:5432/curio_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic -c src/curio/db/alembic.ini upgrade head
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: uv run alembic -c src/curio/db/alembic.ini check
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: uv run pytest

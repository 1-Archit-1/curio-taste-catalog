[project]
name = "curio-taste-catalog"
version = "0.1.0"
description = "Curio: a self-hosted Stremio/Nuvio addon serving AI-curated catalog rows built from your own taste."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-socket>=0.7",
    "respx>=0.22",
    "testcontainers[postgres]>=4.9",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "curio"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
addopts = [
    "-m", "not eval",
    "--strict-markers",
    # Block real network from Python sockets. Postgres (libpq) and the Docker
    # unix socket used by testcontainers are not affected.
    "--disable-socket",
    "--allow-unix-socket",
    "--allow-hosts=127.0.0.1,localhost,::1",
]
markers = [
    "eval: live-LLM evals; opt in with `pytest -m eval`",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
